<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Studio | Intro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{min-height:100vh;background:#05030b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.stage{position:relative;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#2a0645 0%,#10051d 42%,#030108 78%)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#030108}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(3,1,8,.55),transparent 35%,rgba(3,1,8,.2))}
.fallback{position:absolute;z-index:1;text-align:center;padding:24px;pointer-events:none}
.fallback h1{font-size:clamp(2.5rem,8vw,6rem);letter-spacing:.12em;color:#f5e8ff;text-shadow:0 0 18px #a000ff,0 0 38px #6500b8}
.fallback p{margin-top:14px;letter-spacing:.35em;color:#ffd700;font-size:clamp(.7rem,2vw,1rem)}
.controls{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center}
button{border:1px solid #d000ff;background:rgba(18,4,31,.88);color:white;border-radius:30px;padding:12px 20px;font-weight:bold;cursor:pointer}
button:hover{background:#7500bb;box-shadow:0 0 18px #d000ff}
.note{position:absolute;z-index:3;bottom:8px;left:0;right:0;text-align:center;color:#b9a5ca;font-size:11px}
</style>
</head>
<body>
<main class="stage">
  <div class="fallback" id="fallback">
    <h1>JP STUDIO</h1>
    <p>DREAM · CODE · INNOVATE</p>
  </div>
  <video id="introVideo" autoplay muted playsinline preload="auto">
    <source src="videos/jp-studio-assemble-hd.webm" type="video/webm">
    Your browser does not support this video.
  </video>
  <div class="shade"></div>
  <div class="controls">
    <button id="skipBtn" type="button">Skip Intro ↗</button>
    <button id="replayBtn" type="button">Replay</button>
  </div>
  <p class="note">JP STUDIO · PERSONAL PORTFOLIO</p>
</main>
<script>
const video=document.getElementById("introVideo");
const fallback=document.getElementById("fallback");
function enterLogin(){window.location.href="login.html";}
video.addEventListener("loadeddata",()=>{fallback.style.display="none";});
video.addEventListener("ended",enterLogin);
document.getElementById("skipBtn").addEventListener("click",enterLogin);
document.getElementById("replayBtn").addEventListener("click",()=>{
  video.currentTime=0;
  video.play().catch(()=>{});
});
video.play().catch(()=>{
  // If autoplay is blocked or the video file is missing, the JP Studio title remains visible.
});
</script>
</body>
</html>
